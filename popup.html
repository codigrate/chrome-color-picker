<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codigrate Color Picker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<!-- The same panel as the Codigrate Color Picker for macOS: a header with the
     swatch, the color's name, an editable hex field, Pick and copy, the recent
     colors; then the scrollable analysis sections in the same order; then the
     footer link. Same math, same formats. -->
<div class="panel">
  <header class="head">
    <div class="head-row">
      <div class="swatch" id="swatch"></div>
      <div class="head-fields">
        <div class="color-name" id="colorName"></div>
        <input id="hexField" class="hex-field" type="text" spellcheck="false" autocomplete="off"
               placeholder="#RRGGBB" maxlength="7" aria-label="Hex color">
        <div class="head-actions">
          <button id="pick" class="btn" type="button" title="Pick a color from the screen">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.1 4.9a2.1 2.1 0 0 0-3 0l-2.2 2.2-1-1-1.5 1.5 1 1L4 16l-1 4 4-1 7.4-7.4 1 1 1.5-1.5-1-1 2.2-2.2a2.1 2.1 0 0 0 0-3z"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            Pick
          </button>
          <button id="copyHex" class="btn btn-icon" type="button" title="Copy hex">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <p id="unsupported" class="unsupported hidden">Your browser does not support the eyedropper. Please update Chrome to the latest version.</p>
    <div id="recents" class="recents hidden">
      <div class="sec-title">Recent Colors</div>
      <div id="historyRow" class="chips"></div>
    </div>
  </header>

  <div class="analysis" id="analysis">
    <section><div id="conversions"></div></section>
    <section><div class="sec-title">CSS</div><div id="cssRows"></div></section>
    <section><div class="sec-title">Accessibility</div><div id="a11yRows" class="stack4"></div></section>
    <section><div class="sec-title">Color Channels</div><div id="channels" class="stack6"></div></section>
    <section><div class="sec-title">Harmony</div><div id="harmony" class="stack8"></div></section>
    <section><div class="sec-title">Tints, Shades &amp; Tones</div><div id="ramps" class="stack8"></div></section>
    <section><div class="sec-title">Temperature</div><div id="temperature" class="stack8"></div></section>
    <section><div class="sec-title">Color Vision</div><div id="cvd" class="stack4"></div></section>
  </div>

  <footer class="foot">
    <a id="openCodigrate" class="foot-link" target="_blank" rel="noopener">Open in Codigrate Color Tool</a>
    <a class="foot-link muted" target="_blank" rel="noopener" href="https://codigrate.com">Codigrate</a>
  </footer>
</div>

<script src="ral-classic.js"></script>
<script src="color-names.js"></script>
<script src="popup.js"></script>
</body>
</html>
